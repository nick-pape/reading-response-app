name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'minor'

jobs:
  bump-version:
    name: Bump Versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Get current version
        id: get-version
        run: echo "::set-output name=current_version::$(node -p "require('./package.json').version")"

      - name: Bump version
        id: bump-version
        run: |
          current_version="${{ steps.get-version.outputs.current_version }}"
          bump_type="${{ github.event.inputs.bump_type }}"
          new_version=$(npx semver -i $bump_type $current_version)
          echo "::set-output name=new_version::$new_version"
          npm version --no-git-tag-version $new_version

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump-version.outputs.new_version }}"
          git push

  package-linux:
    runs-on: ubuntu-latest
    needs:
      - bump-version
    outputs:
      artifacts: out/make
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: |
          npm run build
          npm run make

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          path: out/make

  package-mac:
    runs-on: macos-latest
    needs:
      - bump-version
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: |
          npm run build
          npm run make

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          path: out/make
      
  package-win:
    runs-on: windows-latest
    needs:
      - bump-version
    outputs:
      artifacts: out/make
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Build and package
        run: |
          npm run build
          npm run make

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          path: out/make

  release:
    runs-on: ubuntu-latest
    needs:
      - package-win
      - package-mac
      - package-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./out/make

      - name: Get current version
        id: get-version
        run: echo "::set-output name=current_version::$(node -p "require('./package.json').version")"
          
      - name: Get next version
        id: next-version
        run: |
          current_version="${{ steps.get-version.outputs.current_version }}"
          bump_type="${{ github.event.inputs.bump_type }}"
          new_version=$(npx semver -i $bump_type $current_version)
          echo "::set-output name=new_version::$new_version"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.next-version.outputs.new_version }}
          files: |
            out/make/artifact/rpm/x64/*.rpm
            out/make/artifact/*.dmg
            out/make/artifact/zip/darwin/x64/*.zip
            out/make/artifact/deb/x64/*.deb
            out/make/artifact/squirrel.windows/x64/*.exe
