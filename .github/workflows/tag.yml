name: Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'minor' # Default to 'minor' if not specified

jobs:
  bump-version:
    name: Bump Versions
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [18.x]
        os: [macOS-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Get current version
        id: get-version
        run: echo "::set-output name=current_version::$(node -p "require('./package.json').version")"

      - name: Bump version
        id: bump-version
        run: |
          current_version="${{ steps.get-version.outputs.current_version }}"
          bump_type="${{ github.event.inputs.bump_type }}"
          new_version=$(npx semver -i $bump_type $current_version)
          echo "::set-output name=new_version::$new_version"
          npm version --no-git-tag-version $new_version

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.bump-version.outputs.new_version }}"
          git push

      - name: Build
        run: |
          npm run build

      - name: Package
        run: |
          npm run package
          npm run make

      - name: List build outputs
        run: |
          find out/make

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump-version.outputs.new_version }}
          files: |
            out/make/squirrel.windows/x64/*.exe



